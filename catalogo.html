<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Moringa Habana</title>
    <meta name="description" content="Explora nuestro catálogo de productos de moringa. Polvo, cápsulas, semillas, té y más en La Habana.">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="frontend/css/styles.css">
    <link rel="stylesheet" href="frontend/css/catalogo.css">
</head>
<body>
    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <img src="resources/img/logo.png" alt="Moringa Habana">
                <div>
                    <h1>Moringa Habana</h1>
                    <span>El árbol milagroso</span>
                </div>
            </div>
            
            <button class="menu-toggle" aria-label="Menú">☰</button>
            
            <nav class="nav">
                <a href="index.html" data-page="inicio">Inicio</a>
                <a href="catalogo.html" data-page="catalogo" class="active">Catálogo</a>
                <a href="contacto.html" data-page="contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- ========== CATÁLOGO ========== -->
    <section class="seccion-catalogo">
        <div class="container">
            <div class="header-catalogo">
                <h1>📦 Catálogo de Productos</h1>
                <span class="contador" id="contador-productos">0 productos</span>
            </div>
            
            <!-- Búsqueda -->
            <div class="search-catalogo">
                <input type="text" id="search-input" placeholder="🔍 Buscar productos..." aria-label="Buscar productos">
                <div class="ordenar-container">
                    <label for="ordenar">Ordenar:</label>
                    <select id="ordenar" class="ordenar-select">
                        <option value="default">Predeterminado</option>
                        <option value="nombre">Nombre</option>
                        <option value="precio-asc">Precio: menor a mayor</option>
                        <option value="precio-desc">Precio: mayor a menor</option>
                        <option value="rating">Mejor valorados</option>
                    </select>
                </div>
            </div>
            
            <!-- Filtros -->
            <div class="filtros-container" id="filtros-container">
                <!-- Renderizado por JS -->
            </div>
            
            <!-- Productos -->
            <div id="productos-container" class="productos-grid">
                <!-- Renderizado por JS -->
            </div>
        </div>
    </section>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div>
                    <h3>🌿 Moringa Habana</h3>
                    <p>El árbol milagroso al alcance de tu mano</p>
                    <p style="margin-top: 8px; font-size: 0.85rem; opacity: 0.7;">Productos 100% naturales</p>
                </div>
                <div class="footer-links">
                    <h4>Enlaces</h4>
                    <a href="index.html">Inicio</a>
                    <a href="catalogo.html">Catálogo</a>
                    <a href="contacto.html">Contacto</a>
                </div>
                <div>
                    <h4>Síguenos</h4>
                    <div class="footer-social">
                        <a href="#" title="WhatsApp" data-red-social="whatsapp">📱</a>
                        <a href="#" title="Telegram" data-red-social="telegram">💬</a>
                        <a href="#" title="Instagram" data-red-social="instagram">📸</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                © 2026 Moringa Habana - Todos los derechos reservados
            </div>
        </div>
    </footer>

    <!-- ========== SCRIPTS ========== -->
    <script src="backend/data.js"></script>
    <script src="backend/script.js"></script>
    <script src="frontend/scripts/main.js"></script>
    <script src="frontend/scripts/catalogo.js"></script>
</body>
</html>
